            cursor: pointer;
            letter-spacing: 2px;
            margin-top: 20px;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }

        .btn-hack:hover {
            background: #00ff41;
            color: #000;
            box-shadow: 0 0 25px #00ff41;

        .console-output {

        }

        .line.warn {
            color: #ffb700;
            text-shadow: 0 0 5px #ffb700;
        }

        .line.danger {
            color: #ff0055;
            text-shadow: 0 0 5px #ff0055;
        }

        .progress-bar {
            width: 100%;
            background: #051a05;
            border: 1px solid #00ff41;
            height: 20px;
            margin-top: 15px;
            display: none;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #00ff41;
            box-shadow: 0 0 10px #00ff41;
            transition: width 0.3s;
        }

        .blinking-cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: #00ff41;
            animation: blink 0.8s infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
